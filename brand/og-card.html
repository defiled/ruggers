<!doctype html>
<!-- Share card source. Render at 1200×630 to public/og.png (see brand/README.md). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    color: #f4f7fb;
    background: linear-gradient(120deg, #0e2a5a 0%, #06122a 70%);
    position: relative;
  }
  /* faint pitch lines in the background */
  .lines { position: absolute; inset: 0; opacity: 0.1; }
  .lines span { position: absolute; top: 0; bottom: 0; width: 2px; background: #ffffff; }
  .card { position: absolute; inset: 0; display: flex; align-items: center; gap: 56px; padding: 0 84px; }
  .crest { width: 420px; height: 420px; flex: none; filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.45)); }
  .eyebrow { font-size: 26px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: #22c55e; }
  h1 { font-size: 92px; line-height: 0.98; font-weight: 900; margin: 14px 0 22px; letter-spacing: -0.02em; }
  p { font-size: 30px; line-height: 1.3; margin: 0; color: #c7d2e3; max-width: 560px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: #22c55e; }
</style>
</head>
<body>
  <div class="lines">
    <span style="left: 60px"></span><span style="left: 240px"></span><span style="left: 420px"></span>
    <span style="left: 600px"></span><span style="left: 780px"></span><span style="left: 960px"></span><span style="left: 1140px"></span>
  </div>
  <div class="card">
    <img class="crest" src="../public/icon-512.png" alt="" />
    <div>
      <div class="eyebrow">Frederick RFC</div>
      <h1>Attack<br />Playbook</h1>
      <p>Formations, backline plays and defence systems, animated.</p>
    </div>
  </div>
  <div class="bar"></div>
</body>
</html>
